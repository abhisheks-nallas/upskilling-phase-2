name: Docker build

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/docker-build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # build only. Pushing to ECR stays manual (deploy/push-image.ps1), so CI needs no AWS keys
      - run: docker build -t onboarding-buddy backend
